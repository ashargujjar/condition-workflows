name: reusable deploy

on:
  workflow_call:
    inputs:
      artifact-name:
        description: name of deployable atrifact file
        required: false
        default: dist
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/download-artifact@v6
        with:
          name: ${{inputs.artifact-name}}
      - name: list files
        run: ls
      - name: output information
        run: echo 'Deploying the project'
