name: metrix-demo
on:
  push:
    branches:
      - master
jobs:
  build:
    strategy:
      matrix:
        node-version: [12, 14, 16]
        operating-system: [unbuntu-latest, windows-latest]
    runs-on: ${{matrix.operating-system}}
    steps:
      - name: get the code
        uses: actions/checkout@v5
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: install depedencies
        run: npm ci
      - name: build project
        run: npm run build
